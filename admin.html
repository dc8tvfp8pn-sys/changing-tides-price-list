<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1424" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tides of Change — Price Admin</title>
  <link rel="icon" href="assets/icon-512-v9.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900:#060e1c; --navy-800:#0a1424; --navy-700:#0e1a30; --navy-600:#12213b;
      --teal:#01c88a; --teal-hi:#16e0a3; --cyan:#22c7e6; --blue:#0b9bdc; --orange:#ff9500;
      --ink:#e8f1fb; --ink-dim:#9db2c9; --line:rgba(34,199,230,.18);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Space Grotesk',system-ui,sans-serif;
      background:var(--navy-900); color:var(--ink);
      min-height:100vh; padding:18px 14px 60px;
    }
    .wrap { max-width:560px; margin:0 auto; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    header img { width:52px; height:52px; border-radius:12px; }
    h1 { font-size:1.25rem; color:#fff; text-shadow:0 0 18px rgba(1,200,138,.45); }
    .sub { color:var(--ink-dim); font-size:.8rem; }
    .card { background:var(--navy-700); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    label { display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin:10px 0 4px; }
    input, select {
      width:100%; padding:12px 14px; border-radius:10px; font:inherit; font-size:1rem;
      background:var(--navy-800); color:var(--ink); border:1px solid var(--line);
    }
    input:focus, select:focus { outline:2px solid var(--teal); outline-offset:1px; }
    button {
      font:inherit; font-weight:700; border:0; border-radius:10px; cursor:pointer;
      padding:13px 18px;
    }
    .btn-primary { background:var(--teal); color:var(--navy-900); width:100%; margin-top:14px; font-size:1rem; }
    .btn-primary:disabled { opacity:.5; }
    .status { min-height:20px; font-size:.85rem; margin-top:10px; color:var(--teal-hi); }
    .status.err { color:#ff7a7a; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .toolbar .who { font-size:.78rem; color:var(--ink-dim); }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--ink-dim); padding:8px 14px; font-size:.8rem; }
    .cat-head { font-size:.95rem; font-weight:700; color:var(--cyan); margin:22px 0 8px; }
    .row { background:var(--navy-700); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
    .row.changed { border-color:var(--orange); }
    .row.dirty-saved { border-color:var(--teal); }
    .row-top { display:flex; gap:8px; }
    .row-top .f-name { flex:2.2; }
    .row-top .f-strength { flex:1.1; }
    .row-top .f-price { flex:.9; position:relative; }
    .row-top input { padding:10px 12px; font-size:.95rem; }
    .f-price input { padding-left:24px; }
    .f-price::before { content:'$'; position:absolute; left:10px; bottom:11px; color:var(--ink-dim); z-index:1; }
    .row-actions { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
    .hide-toggle { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-dim); }
    .hide-toggle input { width:auto; }
    .btn-del { background:transparent; border:1px solid rgba(255,122,122,.4); color:#ff7a7a; padding:7px 12px; font-size:.78rem; }
    .badge-hidden { font-size:.68rem; color:var(--orange); border:1px solid rgba(255,149,0,.4); border-radius:999px; padding:2px 8px; margin-left:6px; }
    details { margin-top:8px; }
    summary { cursor:pointer; color:var(--teal-hi); font-weight:600; font-size:.9rem; padding:8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="assets/icon-512-v9.png" alt="Tides of Change logo" />
      <div>
        <h1>PRICE ADMIN</h1>
        <p class="sub">Tides of Change — edits go live instantly</p>
      </div>
    </header>

    <!-- ================= LOGIN ================= -->
    <section id="loginView" class="card">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" value="admin@tidesofchange.ca" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
      <button id="loginBtn" class="btn-primary">Sign in</button>
      <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <!-- ================= EDITOR ================= -->
    <section id="editorView" hidden>
      <div class="toolbar">
        <span class="who" id="who"></span>
        <button id="logoutBtn" class="btn-ghost">Sign out</button>
      </div>
      <p class="sub" style="margin-bottom:10px">Tap a price, type the new one — it saves as you leave the field. Customers see it on their next visit.</p>
      <div id="rows"></div>
      <p id="editorStatus" class="status" role="status" aria-live="polite"></p>

      <details class="card">
        <summary>Add a product</summary>
        <label for="newCat">Category</label>
        <select id="newCat"></select>
        <label for="newName">Name</label>
        <input id="newName" placeholder="e.g. BPC-157" />
        <label for="newStrength">Strength / size (optional)</label>
        <input id="newStrength" placeholder="e.g. 10 mg" />
        <label for="newPrice">Price</label>
        <input id="newPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="45" />
        <button id="addBtn" class="btn-primary">Add to price list</button>
      </details>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  (function () {
    'use strict';
    var SB_URL = 'https://gvexlysmyqitmvexfxep.supabase.co';
    var SB_KEY = 'sb_publishable_R572xTOvVsbVmsJiU_wCWg_PBw0Wo7J';
    var sb = window.supabase.createClient(SB_URL, SB_KEY);

    var CATEGORIES = [
      ['cat-metabolic', 'Metabolic & Weight'],
      ['cat-recovery', 'Recovery & Tissue Repair'],
      ['cat-growth', 'Growth & Performance'],
      ['cat-cognitive', 'Cognitive, Neuro & Sleep'],
      ['cat-mitochondrial', 'Mitochondrial & Longevity'],
      ['cat-immune', 'Immune & Inflammation'],
      ['cat-skin', 'Skin, Hair & Cosmetic'],
      ['cat-hormone', 'Hormone & Reproductive'],
      ['kits', 'Kits & Supplies'],
      ['services', 'Services']
    ];

    var $ = function (id) { return document.getElementById(id); };
    var loginView = $('loginView'), editorView = $('editorView');
    var loginStatus = $('loginStatus'), editorStatus = $('editorStatus');

    function say(el, msg, isErr) {
      el.textContent = msg || '';
      el.classList.toggle('err', !!isErr);
    }

    function fmt(p) {
      var n = Number(p);
      return Number.isInteger(n) ? String(n) : n.toFixed(2);
    }

    // ---------- login ----------
    $('loginBtn').addEventListener('click', function () {
      var btn = $('loginBtn');
      btn.disabled = true;
      say(loginStatus, 'Signing in…');
      sb.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      }).then(function (res) {
        btn.disabled = false;
        if (res.error) { say(loginStatus, res.error.message, true); return; }
        showEditor();
      });
    });
    $('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('loginBtn').click();
    });

    $('logoutBtn').addEventListener('click', function () {
      sb.auth.signOut().then(function () {
        editorView.hidden = true;
        loginView.hidden = false;
        $('password').value = '';
      });
    });

    // ---------- editor ----------
    function showEditor() {
      loginView.hidden = true;
      editorView.hidden = false;
      sb.auth.getUser().then(function (res) {
        $('who').textContent = res.data.user ? res.data.user.email : '';
      });
      loadRows();
    }

    function loadRows() {
      say(editorStatus, 'Loading…');
      sb.from('price_list').select('*')
        .order('category').order('sort_order')
        .then(function (res) {
          if (res.error) { say(editorStatus, res.error.message, true); return; }
          renderRows(res.data || []);
          say(editorStatus, '');
        });
    }

    function renderRows(items) {
      var host = $('rows');
      host.innerHTML = '';
      CATEGORIES.forEach(function (cat) {
        var catItems = items.filter(function (it) { return it.category === cat[0]; });
        if (!catItems.length) return;
        var h = document.createElement('h2');
        h.className = 'cat-head';
        h.textContent = cat[1];
        host.appendChild(h);
        catItems.forEach(function (it) { host.appendChild(buildRow(it)); });
      });
    }

    function buildRow(item) {
      var row = document.createElement('div');
      row.className = 'row';

      var top = document.createElement('div');
      top.className = 'row-top';

      function field(cls, val, type) {
        var d = document.createElement('div');
        d.className = cls;
        var inp = document.createElement('input');
        inp.value = val;
        if (type) { inp.type = type; inp.min = '0'; inp.step = '0.01'; inp.inputMode = 'decimal'; }
        d.appendChild(inp);
        top.appendChild(d);
        return inp;
      }

      var nameIn = field('f-name', item.name);
      var strIn = field('f-strength', item.strength || '');
      var priceIn = field('f-price', fmt(item.price), 'number');

      var actions = document.createElement('div');
      actions.className = 'row-actions';

      var hideLbl = document.createElement('label');
      hideLbl.className = 'hide-toggle';
      var hideCb = document.createElement('input');
      hideCb.type = 'checkbox';
      hideCb.checked = !item.active;
      hideLbl.appendChild(hideCb);
      hideLbl.appendChild(document.createTextNode('Hide from list'));
      if (!item.active) {
        var badge = document.createElement('span');
        badge.className = 'badge-hidden';
        badge.textContent = 'hidden';
        nameIn.parentNode.appendChild(badge);
      }

      var delBtn = document.createElement('button');
      delBtn.className = 'btn-del';
      delBtn.textContent = 'Delete';

      actions.appendChild(hideLbl);
      actions.appendChild(delBtn);
      row.appendChild(top);
      row.appendChild(actions);

      function save(patch) {
        say(editorStatus, 'Saving…');
        return sb.from('price_list').update(patch).eq('id', item.id)
          .then(function (res) {
            if (res.error) { say(editorStatus, 'Save failed: ' + res.error.message, true); return false; }
            Object.assign(item, patch);
            say(editorStatus, 'Saved — live now.');
            row.classList.remove('changed');
            row.classList.add('dirty-saved');
            setTimeout(function () { row.classList.remove('dirty-saved'); }, 1600);
            return true;
          });
      }

      [nameIn, strIn, priceIn].forEach(function (inp) {
        inp.addEventListener('input', function () { row.classList.add('changed'); });
        inp.addEventListener('change', function () {
          var patch = {
            name: nameIn.value.trim(),
            strength: strIn.value.trim(),
            price: parseFloat(priceIn.value)
          };
          if (!patch.name || !isFinite(patch.price) || patch.price < 0) {
            say(editorStatus, 'Name required, price must be 0 or more.', true);
            return;
          }
          save(patch);
        });
      });

      hideCb.addEventListener('change', function () {
        save({ active: !hideCb.checked }).then(function (ok) {
          if (ok) loadRows();
        });
      });

      delBtn.addEventListener('click', function () {
        if (!window.confirm('Delete "' + item.name + '" permanently?')) return;
        sb.from('price_list').delete().eq('id', item.id).then(function (res) {
          if (res.error) { say(editorStatus, res.error.message, true); return; }
          say(editorStatus, 'Deleted.');
          row.remove();
        });
      });

      return row;
    }

    // ---------- add product ----------
    var sel = $('newCat');
    CATEGORIES.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c[0]; o.textContent = c[1];
      sel.appendChild(o);
    });

    $('addBtn').addEventListener('click', function () {
      var name = $('newName').value.trim();
      var price = parseFloat($('newPrice').value);
      if (!name || !isFinite(price) || price < 0) {
        say(editorStatus, 'New product needs a name and a valid price.', true);
        return;
      }
      sb.from('price_list').select('sort_order')
        .eq('category', sel.value)
        .order('sort_order', { ascending: false }).limit(1)
        .then(function (res) {
          var next = (res.data && res.data[0] ? res.data[0].sort_order : 0) + 1;
          return sb.from('price_list').insert({
            category: sel.value, name: name,
            strength: $('newStrength').value.trim(),
            price: price, sort_order: next
          });
        })
        .then(function (res) {
          if (res.error) { say(editorStatus, res.error.message, true); return; }
          $('newName').value = ''; $('newStrength').value = ''; $('newPrice').value = '';
          say(editorStatus, 'Added — live now.');
          loadRows();
        });
    });

    // ---------- session restore ----------
    sb.auth.getSession().then(function (res) {
      if (res.data.session) showEditor();
    });
  })();
  </script>
</body>
</html>
